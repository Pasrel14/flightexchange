name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # release GitHub
  id-token: write # publication de confiance npm (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r "conformance-$GITHUB_REF_NAME.zip" SPECIFICATION.md schema examples tests/fixtures
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "conformance-$GITHUB_REF_NAME.zip" examples/minimal.fxf examples/complete.fxf
